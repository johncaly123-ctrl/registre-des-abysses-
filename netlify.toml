[build]
  command = "npm run build"
  publish = "dist"

[[edge_functions]]
  path = "/"
  function = "og-partage"

# Defense-in-depth headers (revue de securite 2026-08-03). Volontairement pas
# de script-src/style-src restrictifs dans la CSP : l'app charge Google Fonts
# via @import CSS, un service worker, et potentiellement des workers Tesseract.js
# pour l'OCR -- un CSP strict casserait ca sans benefice reel puisqu'il n'y a
# aucun point d'injection HTML/script cote client (voir revue). frame-ancestors/
# object-src/base-uri sont sans risque de regression et bloquent le clickjacking
# et l'injection de balise <base>.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
